spring:
  application:
    name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:8432/event-store}
    username: ${SPRING_DATASOURCE_USERNAME:transaction}
    password: ${SPRING_DATASOURCE_PASSWORD:transaction}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: banking-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: ru.bank.transactionmicroservice.dto.PaymentTransactionEvent
        spring.json.trusted.packages: ru.bank.transactionmicroservice.dto
        spring.json.use.type.headers: false

server:
  port: 5050
